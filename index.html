<!DOCTYPE html>

<meta charset="UTF-8">

<script>
/* ต้องรันก่อนอย่างอื่นทั้งหมด
   1) จำโฟลเดอร์ที่เว็บติดตั้งอยู่ (คำนวณจาก URL ตอนเปิดหน้าเท่านั้น)
   2) ประกาศ <base> เพื่อให้รูปและไฟล์ต่าง ๆ ที่อ้างแบบสั้น เช่น CIS.png หาเจอเสมอ
      แม้ URL จะเป็น /admin/hero หรือ /project/xxx
   3) ถอดพาธที่ 404.html ส่งต่อมา (รูปแบบ ?/พาธ) กลับเป็น URL ปกติ */
(function (l, d) {
  var p = l.pathname;
  /* เว็บตัวจริงอยู่บน Cloudflare เพราะมีระบบหลังบ้าน (/api) ให้ทุกคนใช้ข้อมูลชุดเดียวกัน
     GitHub Pages เสิร์ฟได้แต่ไฟล์นิ่ง เข้าหลังบ้านไม่ได้ ลิงก์เก่าที่ยังส่งต่อกันอยู่
     จึงพาผู้ใช้มาที่ตัวจริงให้เอง โดยคงหน้าที่เขากำลังจะเปิดไว้ */
  if (/\.github\.io$/i.test(l.hostname)) {
    var folder = p.slice(0, p.lastIndexOf("/") + 1);
    var rest = l.search[1] === "/"
      ? l.search.slice(2).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?")
      : p.slice(folder.length);
    var h = l.hash;
    /* ลิงก์รุ่นเก่ายังเป็นแบบ #/contact ให้แปลงเป็น URL แบบใหม่ */
    if (!rest && h.indexOf("#/") === 0) { rest = h.slice(2); h = ""; }
    l.replace("https://crystal-ideas-solution.pages.dev/" + rest + h);
    return;
  }
  /* โฟลเดอร์ที่เว็บติดตั้งอยู่
     - เปิดไฟล์ตรง ๆ : ใช้โฟลเดอร์ของไฟล์
     - GitHub Pages  : เว็บอยู่ในโฟลเดอร์ชื่อ repo และ 404.html พาเรากลับมาที่โฟลเดอร์นั้นเสมอ
     - ที่อื่น ๆ     : เว็บอยู่ที่รากของโดเมน (เช่น Cloudflare Pages) ซึ่งเสิร์ฟ URL ลึกได้ตรง ๆ
                       จึงคำนวณจาก pathname ไม่ได้ */
  window.__BASE__ = l.protocol === "file:" ? p.slice(0, p.lastIndexOf("/") + 1)
    : /\.github\.io$/i.test(l.hostname) ? p.slice(0, p.lastIndexOf("/") + 1)
    : "/";
  if (l.protocol !== "file:") {
    var b = d.createElement("base");
    b.href = window.__BASE__;
    d.head.appendChild(b);
  }
  if (l.search[1] === "/") {
    var decoded = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
    history.replaceState(null, "", p.replace(/\/$/, "") + decoded + l.hash);
  }
})(window.location, document);
</script>

<style>
/* =========================================================
   BRAND TOKENS
   ========================================================= */
:root{
  --blue:#1668FF;
  --blue-d:#0B4FD6;
  --blue-l:#EAF2FF;
  --ink:#111111;
  --muted:#6B7280;
  --bg:#F7F8FA;
  --line:#E5E7EB;
  --navy:#0A1630;
  --navy-2:#0F2147;
  --white:#FFFFFF;
  --radius:6px;
  --wrap:1200px;
  --font:'Manrope','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--white);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---------- Type ---------- */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--blue);text-transform:uppercase;margin:0 0 6px}
.h2{font-size:clamp(24px,2.6vw,32px);line-height:1.3;font-weight:800;margin:0 0 14px}
.lead{color:var(--muted);margin:0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:4px;font-size:14px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border:1.5px solid transparent;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-d)}
.btn-ghost{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.btn-ghost:hover{background:#fff;color:var(--navy)}
.btn-sm{padding:10px 18px;font-size:13px}
.link-arrow{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--blue);padding-bottom:3px;display:inline-block}

/* =========================================================
   HEADER
   ========================================================= */
.site-header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hdr{display:flex;align-items:center;gap:32px;height:76px}
.logo{display:flex;align-items:center;flex-shrink:0}
.logo img{height:44px;width:auto;object-fit:contain}
.logo.on-dark img{filter:brightness(0) invert(1)}
.nav{display:flex;gap:30px;margin:0 auto}
.nav a{font-size:14.5px;font-weight:600;color:#374151;padding:26px 0;border-bottom:2px solid transparent}
.nav a:hover{color:var(--blue)}
.nav a.active{color:var(--blue);border-bottom-color:var(--blue)}
.hdr-phone{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;line-height:1.35}
.hdr-phone svg{width:26px;height:26px;color:var(--blue);flex-shrink:0}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-shrink:0}
.lang button{background:none;border:0;padding:8px 11px;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:#6B7280;cursor:pointer;line-height:1}
.lang button:hover{color:var(--blue)}
.lang button[aria-pressed="true"]{background:var(--blue);color:#fff}
.menu-btn{display:none;background:none;border:0;padding:8px;cursor:pointer;margin-left:12px}
.menu-btn span{display:block;width:24px;height:2px;background:var(--ink);margin:5px 0;transition:transform .2s,opacity .2s}
.menu-open .menu-btn span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-open .menu-btn span:nth-child(2){opacity:0}
.menu-open .menu-btn span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mobile-nav{display:none}

/* =========================================================
   IMAGE FRAME (ใช้รูปจริง ถ้ายังไม่มีรูปจะเว้นว่างไว้)
   ========================================================= */
.ph{position:relative;overflow:hidden;aspect-ratio:4/3;background:#E7EBF1;border-radius:2px}
.ph img{width:100%;height:100%;object-fit:cover}
.ph-empty{background:repeating-linear-gradient(45deg,#EEF1F6 0 10px,#E6EAF1 10px 20px)}

/* =========================================================
   HERO (Home)
   ========================================================= */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden;min-height:520px}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .5s}
.hero-bg.on{opacity:1}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,15,34,.95) 0%,rgba(7,15,34,.8) 38%,rgba(7,15,34,.42) 72%,rgba(7,15,34,.3) 100%)}
.hero-inner{position:relative;z-index:2;padding-block:72px 64px;min-height:520px;display:flex;flex-direction:column;justify-content:center}
.hero-tags{font-size:14px;letter-spacing:.1em;color:#AFC0DD;margin:0 0 12px}
.hero h1{font-size:clamp(38px,5.4vw,64px);line-height:1.05;font-weight:800;margin:0 0 18px;max-width:15ch;letter-spacing:-.01em}
.hero p.sub{font-size:clamp(15px,1.4vw,18px);color:#DCE4F3;max-width:36em;margin:0 0 30px}
.hero-btns{display:flex;gap:14px;flex-wrap:wrap}
.hero-side{position:absolute;right:24px;top:64px;border-left:1.5px solid rgba(255,255,255,.5);padding:0 0 30px 14px;font-size:12px;font-weight:700;letter-spacing:.08em;line-height:1.9;color:#E3EAF7;z-index:2}
.hero-dots{position:absolute;right:24px;bottom:26px;display:flex;gap:18px;z-index:2}
.hero-dots button{background:none;border:0;color:#9FB0CE;font-weight:700;font-size:13px;cursor:pointer;padding:4px 0;border-bottom:2px solid transparent}
.hero-dots button[aria-current="true"]{color:#fff;border-bottom-color:#fff}
.hero-copy{transition:opacity .35s}
.hero-copy.fade{opacity:0}

/* ---------- Page hero (inner pages) ---------- */
.phero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.phero-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.phero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,15,34,.95) 0%,rgba(7,15,34,.82) 45%,rgba(7,15,34,.5) 100%)}
.phero-inner{position:relative;z-index:2;padding-block:72px 64px}
.phero h1{font-size:clamp(28px,3.6vw,44px);line-height:1.25;font-weight:800;margin:0 0 14px;max-width:18em}
.phero p{color:#D5DEEE;max-width:34em;margin:0}
.phero .eyebrow{color:#9DBBFF}
.wall-text{position:absolute;right:6%;top:16%;z-index:1;font-weight:800;font-size:clamp(24px,4vw,52px);line-height:1;letter-spacing:.04em;color:rgba(255,255,255,.14);transform:rotate(-6deg);text-transform:uppercase;text-align:left}

/* =========================================================
   SECTIONS
   ========================================================= */
.sec{padding:80px 0}
.sec-tint{background:var(--bg)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}

/* Services (home) */
.svc-grid{display:grid;grid-template-columns:minmax(240px,1.1fr) repeat(4,1fr);gap:28px;align-items:start}
.svc-intro .lead{margin-bottom:34px}
.svc-card .ph{aspect-ratio:3/2;margin-bottom:18px}
.svc-card h3{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;padding-left:12px}
.dotlist{list-style:none;margin:0;padding:0 0 0 12px;font-size:14px;color:#4B5563;line-height:1.95}
.dotlist li{position:relative;padding-left:14px}
.dotlist li::before{content:"";position:absolute;left:0;top:.85em;width:4px;height:4px;border-radius:50%;background:#9CA3AF}

/* Process */
.process{background:var(--blue-l)}
.process .wrap{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:center;padding-top:40px;padding-bottom:40px}
.steps{list-style:none;margin:0;padding:0 0 0 28px;border-left:1px solid #C9D8F5;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;position:relative}
.step svg{width:30px;height:30px;color:var(--blue);flex-shrink:0;margin-top:4px}
.step .n{color:var(--blue);font-weight:800;font-size:15px}
.step b{display:block;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase}
.step small{display:block;font-size:13px;color:#4B5563}
.step:not(:last-child)::after{content:"";position:absolute;right:-4px;top:18px;width:18px;border-top:1px solid #9DB6E8}

/* Filter tabs */
.tabs{display:flex;gap:24px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:6px 0;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:#4B5563;cursor:pointer;border-bottom:2px solid transparent;text-transform:uppercase}
.tabs button:hover{color:var(--blue)}
.tabs button[aria-pressed="true"]{color:var(--blue);border-bottom-color:var(--blue)}

/* Project cards */
.proj-row{position:relative}
.proj-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 72px)/4);gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.proj-scroll::-webkit-scrollbar{display:none}
.proj-card{scroll-snap-align:start;display:block}
.proj-card .ph{aspect-ratio:16/11;margin-bottom:12px}
.proj-card h3{font-size:15px;font-weight:800;margin:0 0 2px}
.proj-card p{font-size:13.5px;color:var(--muted);margin:0}
.proj-card:hover h3{color:var(--blue)}
.proj-card:hover .ph{outline:3px solid var(--blue);outline-offset:-3px}
.row-next{position:absolute;right:-40px;top:32%;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.row-next:hover{border-color:var(--blue);color:var(--blue)}
.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* Why us */
.why .wrap{display:grid;grid-template-columns:1.2fr repeat(4,1fr);gap:0;align-items:start}
.why-intro{padding-right:28px}
.why-intro .h2{font-size:clamp(28px,3vw,38px);line-height:1.15;text-transform:uppercase}
.why-item{padding:6px 24px;border-left:1px solid var(--line);min-height:110px}
.why-item svg{width:34px;height:34px;color:var(--blue);margin-bottom:14px}
.why-item b{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.why-item small{font-size:13.5px;color:#4B5563;display:block;line-height:1.55}

/* Trusted by */
.trusted .wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:center;padding-top:36px;padding-bottom:36px}
.logos{overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.logos-track{display:flex;align-items:center;gap:44px;width:max-content;animation:marq 45s linear infinite}
.logos:hover .logos-track{animation-play-state:paused}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cl{flex-shrink:0;display:grid;place-items:center}
.cl img{height:52px;width:auto;max-width:150px;object-fit:contain;opacity:.92;transition:opacity .25s,transform .25s}
.cl:hover img{opacity:1;transform:scale(1.04)}
.cl-txt{color:#6B7280;font-weight:800;font-size:24px;white-space:nowrap}

/* CTA band */
.cta{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.cta::before{content:"";position:absolute;left:8%;top:-40%;width:46%;height:180%;background:radial-gradient(ellipse,rgba(30,110,255,.32),transparent 62%)}
.cta .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1.25fr 1.25fr;gap:36px;align-items:center;padding-top:40px;padding-bottom:40px}
.cta-logo img{height:64px;width:auto;object-fit:contain;filter:brightness(0) invert(1)}
.cta h2{font-size:clamp(24px,2.8vw,32px);margin:0 0 6px;font-weight:800}
.cta p{color:#C9D3E8;margin:0 0 20px}
.cta .eyebrow{color:#8FB3FF}
.cta-contact{display:flex;gap:28px;align-items:center;border-left:1px solid rgba(255,255,255,.2);padding-left:36px}
.cinfo{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.cinfo li{display:flex;gap:14px;align-items:center;font-weight:600}
.cinfo svg{width:24px;height:24px;flex-shrink:0}
.qr{width:96px;height:96px;background:#fff;padding:6px;flex-shrink:0;border-radius:2px}
.qr img{width:100%;height:100%;object-fit:contain}
.qr-empty{display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.3}

/* Footer */
.site-footer{background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.ftr{display:flex;align-items:center;justify-content:center;gap:24px 28px;flex-wrap:wrap;padding:26px 24px}
.fnav{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:#374151}
.fnav a:hover{color:var(--blue)}
.copy{margin:0;width:100%;text-align:center;font-size:15px;color:#4B5563}
.copy a{color:var(--muted);text-decoration:underline}
.ftr .social{flex-shrink:0}

.social{display:flex;gap:10px}
.social a{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.social a:hover{background:var(--blue)}
.social svg{width:15px;height:15px}

/* Floating contact buttons */
.fab{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;z-index:40}
.fab a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(10,22,48,.28)}
.fab svg{width:20px;height:20px}
.fab .f-line{background:#06C755}
.fab .f-tel{background:var(--blue)}
.fab .f-mail{background:#1F2937}
.fab a:hover{transform:translateY(-2px)}
body.is-admin .fab{display:none}

/* =========================================================
   SERVICES PAGE
   ========================================================= */
.svc-blocks{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.svc-block{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;background:#fff;border:1px solid var(--line);padding:28px}
.svc-block .num{font-size:36px;font-weight:800;color:var(--blue);line-height:1}
.svc-block h2{font-size:18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:6px 0 2px}
.svc-block .th{font-size:14px;color:var(--muted);margin:0 0 14px}
.svc-block .dotlist{padding-left:0}
.svc-block .ph{aspect-ratio:auto;height:100%;min-height:240px}
.custom-bar{margin-top:40px;background:var(--blue-l);display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 32px;flex-wrap:wrap}
.custom-bar b{display:block;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.custom-bar p{margin:2px 0 0;color:#4B5563;font-size:14.5px}

/* Pagination */
.pager{display:flex;justify-content:center;gap:8px;margin-top:44px}
.pager button{min-width:38px;height:38px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;border-radius:2px}
.pager button[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}

/* =========================================================
   ABOUT
   ========================================================= */
.vision>*,.contact-grid>*,.map-row>*,.pd-grid>*,.svc-grid>*,.svc-block>*,.gallery>*,.why .wrap>*,.cta .wrap>*,.process .wrap>*,.trusted .wrap>*,.values>*,.gal-grid>*,.pgrid>*,.grid2>*,.grid3>*,.grid4>*{min-width:0}
.vision{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center}
.vision blockquote{margin:0;font-size:clamp(18px,1.8vw,22px);font-weight:700;line-height:1.6;color:var(--ink);border-left:4px solid var(--blue);padding-left:20px}
.vision .ph{aspect-ratio:4/3}
.values{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.value{text-align:center;padding:28px 16px;background:#fff;border:1px solid var(--line)}
.value svg{width:44px;height:44px;color:var(--blue);margin:0 auto 14px}
.value b{display:block;letter-spacing:.05em;text-transform:uppercase;font-size:14px}
.value small{color:var(--muted);font-size:14px}
.gal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.gal-grid figure{margin:0}
.gal-grid figcaption{font-weight:700;margin-top:10px}
.gal-grid figcaption small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.cta-slim{background:var(--navy);color:#fff}
.cta-slim .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:34px;padding-bottom:34px;flex-wrap:wrap}
.cta-slim b{font-size:clamp(17px,2vw,22px);display:block;text-transform:uppercase;letter-spacing:.02em}
.cta-slim p{margin:2px 0 0;color:#C9D3E8}

/* =========================================================
   CONTACT
   ========================================================= */
.contact-grid{display:grid;grid-template-columns:1fr 1.3fr;gap:48px}
.cblock{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.cblock:first-child{padding-top:0}
.cblock svg{width:28px;height:28px;color:var(--blue);flex-shrink:0;margin-top:2px}
.cblock b{display:block;font-size:15px}
.cblock p,.cblock a{margin:0;color:#374151;font-size:15px}
.cblock a:hover{color:var(--blue)}
.cblock .qr{margin-top:10px;border:1px solid var(--line)}
.qr-row{display:flex;gap:14px;flex-wrap:wrap}
.form{background:#fff;border:1px solid var(--line);padding:32px}
.form h2{font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin:0}
.form>p{color:var(--muted);margin:2px 0 22px;font-size:14.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid #D1D5DB;border-radius:3px;padding:12px 14px;background:#fff;color:var(--ink);font-size:15px}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,104,255,.15)}
.field .err{color:#C62828;font-size:13px;margin-top:4px;display:none}
.field.invalid input{border-color:#C62828}
.field.invalid .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .btn{width:100%;justify-content:center;margin-top:6px}
.form-ok{display:none;background:#E8F5EC;border:1px solid #B7E0C3;color:#1B5E33;padding:14px 16px;margin-top:14px;font-size:14.5px}
.map-row{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;margin-top:48px}
.map{border:1px solid var(--line);min-height:320px;background:var(--bg);position:relative}
.map iframe{width:100%;height:100%;min-height:320px;border:0;display:block}
.map-link{position:absolute;right:10px;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--blue)}
.hours .ph{aspect-ratio:16/10;margin-bottom:16px}
.hours b{display:block}
.hours p{margin:2px 0 0;color:#374151}

/* =========================================================
   PROJECT DETAIL
   ========================================================= */
.back{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase;margin-bottom:20px}
.gallery{display:grid;grid-template-columns:1fr 150px;gap:14px}
.gallery .main .ph{aspect-ratio:16/9}
.thumbs{display:grid;gap:14px;align-content:start}
.thumbs button{padding:0;border:2px solid transparent;background:none;cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--blue)}
.thumbs .ph{aspect-ratio:4/3}
.pd-title{margin:28px 0 4px;font-size:clamp(24px,2.6vw,32px);font-weight:800}
.pd-sub{color:var(--muted);margin:0 0 28px}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.pd-table{width:100%;border-collapse:collapse;font-size:15px}
.pd-table th{text-align:left;font-weight:600;color:var(--muted);width:34%;padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.pd-table td{padding:10px 0;border-bottom:1px solid var(--line)}
.pd-grid h2{font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px}
.pd-more{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}

/* =========================================================
   RESPONSIVE (site)
   ========================================================= */
/* ปุ่มเลื่อนผลงานยื่นออกนอกกรอบ 40px ต้องมีที่ว่างข้างนอกพอ
   ไม่งั้นมันจะดันหน้าเว็บจนเลื่อนแนวนอนได้ (เกิดช่วง 1181-1231px) */
@media (max-width:1240px){
  .row-next{right:-8px}
}
@media (max-width:1180px){
  .hdr-phone{display:none}
}
@media (max-width:1024px){
  .svc-grid{grid-template-columns:repeat(2,1fr)}
  .svc-intro{grid-column:1/-1}
  .process .wrap{grid-template-columns:1fr}
  .steps{border-left:0;padding-left:0;grid-template-columns:repeat(3,1fr);row-gap:24px}
  .step::after{display:none}
  .why .wrap{grid-template-columns:repeat(2,1fr);row-gap:28px}
  .why-intro{grid-column:1/-1}
  .why-item:nth-child(2n){border-left:0;padding-left:0}
  .trusted .wrap{grid-template-columns:1fr}
  .cta .wrap{grid-template-columns:1fr 1fr}
  .cta-logo{display:none}
  .proj-scroll{grid-auto-columns:calc((100% - 24px)/2.2)}
  .svc-blocks{grid-template-columns:1fr}
}
@media (max-width:900px){
  .nav,.hdr .btn{display:none}
  .menu-btn{display:block}
  .hdr .lang{margin-left:auto}
  .mobile-nav{display:block;position:fixed;left:0;right:0;top:calc(76px + env(safe-area-inset-top,0px));bottom:0;background:#fff;z-index:49;padding:12px 24px 24px;transform:translateX(100%);transition:transform .25s;overflow:auto;visibility:hidden}
  .menu-open .mobile-nav{transform:none;visibility:visible}
  .mobile-nav a{display:block;padding:16px 0;font-size:18px;font-weight:700;border-bottom:1px solid var(--line)}
  .mobile-nav a.active{color:var(--blue)}
  .mobile-nav .btn{margin-top:22px;width:100%;justify-content:center}
  .mobile-nav .mphone{margin-top:18px;color:var(--muted);font-weight:600}
  .hero-side{display:none}
  .hero-shade{background:linear-gradient(180deg,rgba(7,15,34,.55) 0%,rgba(7,15,34,.9) 55%)}
  .phero-shade{background:linear-gradient(180deg,rgba(7,15,34,.6) 0%,rgba(7,15,34,.92) 70%)}
  .wall-text{opacity:.5}
  .contact-grid,.map-row,.vision,.pd-grid{grid-template-columns:1fr}
  .proj-grid{grid-template-columns:repeat(2,1fr)}
  .values{grid-template-columns:repeat(2,1fr)}
  .cta .wrap{grid-template-columns:1fr}
  .cta-contact{border-left:0;padding-left:0;border-top:1px solid rgba(255,255,255,.2);padding-top:24px}
  .gallery{grid-template-columns:1fr}
  .thumbs{grid-template-columns:repeat(4,1fr)}
  .pd-more{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){
  .sec{padding:56px 0}
  .wrap{padding:0 18px}
  .logo img{height:36px}
  .svc-grid{grid-template-columns:1fr 1fr;gap:20px}
  .svc-card h3,.dotlist{padding-left:0}
  .steps{grid-template-columns:1fr 1fr}
  .why .wrap{grid-template-columns:1fr}
  .why-item{border-left:0;padding:0;min-height:0}
  .proj-grid{grid-template-columns:1fr}
  .proj-scroll{grid-auto-columns:78%}
  .row-next{display:none}
  .svc-block{grid-template-columns:1fr;padding:22px}
  .svc-block .ph{min-height:200px;order:-1}
  .gal-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .form{padding:22px}
  .cta-contact{flex-direction:column;align-items:flex-start}
  .copy{font-size:14px}
  .ftr{gap:18px}
  .fab a{width:42px;height:42px}
}

/* =========================================================
   ADMIN (ระบบจัดการเนื้อหา)
   ========================================================= */
body.is-admin{background:#F3F5F9}
body.is-admin .site-header,body.is-admin .site-footer{display:none}
.adm{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.adm .btn{text-transform:none;letter-spacing:0}
.adm-side{background:var(--navy);color:#C9D3E8;padding:20px 14px 20px;padding-top:calc(20px + env(safe-area-inset-top,0px));position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column}
.adm-brand{display:block;padding:4px 10px 24px}
.adm-brand img{height:40px;width:auto;object-fit:contain;filter:brightness(0) invert(1)}
.adm-brand small{display:block;font-size:12px;color:#9FB0CE;margin-top:8px}
.adm-side nav{display:grid;gap:2px}
.adm-side nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:6px;font-size:14.5px;font-weight:600}
.adm-side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.adm-side nav a.on{background:var(--blue);color:#fff}
.adm-side nav svg{width:19px;height:19px;flex-shrink:0}
.adm-side nav em{margin-left:auto;background:#F04438;color:#fff;font-style:normal;font-size:12px;font-weight:700;border-radius:10px;padding:0 8px;line-height:20px}
.adm-side-foot{margin-top:auto;padding:16px 12px 0;border-top:1px solid rgba(255,255,255,.12);display:grid;gap:12px;font-size:14px}
.adm-side-foot a:hover,.adm-side-foot button:hover{color:#fff}
.adm-side-foot button{background:none;border:0;color:inherit;text-align:left;padding:0;cursor:pointer}
.adm-top{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:14px 28px;padding-inline:calc(28px + max(0px,(100% - 1560px)/2));padding-top:calc(14px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:5}
.adm-top h1{font-size:20px;margin:0;font-weight:800;line-height:1.3}
.adm-top .sp{margin-left:auto;display:flex;gap:10px}
.adm-menu{display:none;background:none;border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer}
.adm-menu svg{width:20px;height:20px;display:block}
.adm-body{padding:28px;max-width:1560px;margin-inline:auto;width:100%;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.adm-scrim{display:none}

.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:20px}
.card h2{font-size:16px;margin:0 0 14px;font-weight:800}
.lead-a{color:var(--muted);margin:0 0 18px}
.hint{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.btn-line{border-color:#CBD2DC;color:var(--ink);background:#fff}
.btn-line:hover{border-color:var(--blue);color:var(--blue)}
.btn-danger{background:#D92D20;color:#fff}
.btn-danger:hover{background:#B42318}
.btn-text{background:none;border:0;color:#B42318;padding:6px 4px;font-weight:600;cursor:pointer;font-size:13px}
.btn-xs{padding:7px 12px;font-size:12.5px}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:1px solid #CBD2DC;background:#fff;border-radius:6px;cursor:pointer;font-weight:700;color:#374151;padding:0}
.icon-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.icon-btn.danger:hover:not(:disabled){border-color:#D92D20;color:#D92D20}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:16px;height:16px}
.row-act{display:flex;gap:6px;align-items:center}

.note{padding:12px 16px;border-radius:6px;margin-bottom:20px;font-size:14.5px}
.note.warn{background:#FFF7E6;border:1px solid #FAD48C;color:#7A4B00}
.note.info{background:var(--blue-l);border:1px solid #C6D9FF;color:#123E91}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px}
.stat:hover{border-color:var(--blue)}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.stat.alert b{color:#D92D20}
.quick{display:flex;flex-wrap:wrap;gap:10px}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.mini-list li:last-child{border-bottom:0}
.mini-list small{color:var(--muted)}
.dot-new{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px}

/* image field */
.imgf-box{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.imgf-prev{position:relative;width:180px;aspect-ratio:16/10;background:#EEF1F5 repeating-linear-gradient(45deg,transparent 0 8px,rgba(0,0,0,.025) 8px 16px);border:1px dashed #C2C9D4;border-radius:6px;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.imgf[data-kind="logo"] .imgf-prev{width:150px;aspect-ratio:3/2;background:#fff}
.imgf[data-kind="logo"] .imgf-prev img{object-fit:contain;padding:6px}
.imgf-prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgf-prev span{font-size:12.5px;color:var(--muted)}
.imgf-act{display:grid;gap:4px;justify-items:start}
.imgf-act label.btn{cursor:pointer;margin:0;font-size:12.5px;font-weight:700}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.gal-item{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.gal-item img{width:100%;height:100%;object-fit:cover}
.gal-item button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(17,17,17,.75);color:#fff;cursor:pointer;font-size:15px;line-height:1}
.gal-add{aspect-ratio:1;border:1.5px dashed #AEB8C6;border-radius:6px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;padding:6px}
.gal-add:hover{border-color:var(--blue);background:var(--blue-l)}

/* editor cards */
/* รูปอยู่คอลัมน์แคบด้านซ้าย (.ed-grid) หรือด้านขวา (.ed-grid-r) ที่เหลือยกให้ฟอร์ม
   ทำให้จอกว้างไม่เหลือพื้นที่ว่างข้าง ๆ และช่องกรอกได้ความกว้างเต็มที่ */
.ed-grid{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:24px;align-items:start}
.ed-grid-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,300px);gap:24px;align-items:start}
.ed-grid>*,.ed-grid-r>*{min-width:0}
/* โลโก้ลูกค้ามีแค่รูปกับชื่อ เรียงเป็นตารางจะเห็นได้หลายแบรนด์ในหน้าจอเดียว */
.cli-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;align-items:start;margin-bottom:20px}
.cli-list .card{margin-bottom:0}
.cli-list .imgf-box{flex-direction:column}
.cli-list .imgf[data-kind="logo"] .imgf-prev{width:100%}
.cli-list .field:last-child{margin-bottom:0}
/* ช่องคู่ไทย/อังกฤษ ยุบเป็นคอลัมน์เดียวเองเมื่อที่แคบ โดยดูจากกล่องที่มันอยู่ */
.adm-body .two{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.ed-head b{font-size:15px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;bottom:0;background:rgba(243,245,249,.96);padding:14px 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);z-index:3}
.bar .r{display:flex;gap:10px;margin-left:auto}
.field select{appearance:auto}

/* toolbar + table */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{border:1px solid #D1D5DB;border-radius:6px;padding:10px 12px;font-size:14.5px;background:#fff}
.toolbar input{flex:1;min-width:200px}
.toolbar .btn{margin-left:auto}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;min-width:760px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .tthumb{width:76px}
.tbl .grow{width:55%}
.tbl .tthumb .ph{width:76px;aspect-ratio:4/3;border-radius:4px}
.tbl b{display:block}
.tbl small{color:var(--muted)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:#EEF1F5;font-size:12.5px;font-weight:600;white-space:nowrap}
.tbl-empty{text-align:center;color:var(--muted);padding:32px 14px!important}

/* switch */
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:#CBD2DC;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;margin:0}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.sw:checked{background:var(--blue)}
.sw:checked::before{transform:translateX(18px)}
.sw-row{display:flex;gap:12px;align-items:center;font-weight:600;font-size:14.5px}

/* project form */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.pgrid .side{position:sticky;top:90px}
.back-a{display:inline-block;color:var(--blue);font-weight:700;font-size:14px;margin-bottom:16px}

/* messages */
.msg{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.msg summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 18px}
.msg summary::-webkit-details-marker{display:none}
.msg summary b{font-size:15px}
.msg summary small{color:var(--muted)}
.msg.unread{border-left:4px solid var(--blue)}
.msg-body{padding:0 18px 16px;border-top:1px solid var(--line)}
.msg-body dl{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:14px 0;font-size:14.5px}
.msg-body dt{color:var(--muted)}
.msg-body dd{margin:0;white-space:pre-wrap;word-break:break-word}

/* empty */
.empty-a{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-a b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#0A1630,#15305f)}
.login-box{background:#fff;border-radius:10px;padding:34px;width:100%;max-width:380px;display:grid;gap:4px}
.login-box .logo{margin-bottom:18px;justify-content:center}
.login-box h1{font-size:20px;margin:0 0 18px;text-align:center}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-right:46px}
.pw-eye{position:absolute;right:6px;width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:6px;padding:0}
.pw-eye:hover{color:var(--blue);background:var(--blue-l)}
.pw-eye svg{width:19px;height:19px;display:block}
.cap-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cap-row canvas{border:1px solid var(--line);border-radius:4px;background:#EEF2F8;flex:1;max-width:100%;height:60px;-webkit-user-select:none;user-select:none}
.login-box .err-line{text-align:center}
.login-box .btn:disabled{opacity:.55;cursor:default}
.login-box .btn{justify-content:center;width:100%;text-transform:none;letter-spacing:0}
.login-box>a{color:var(--muted);font-size:14px;text-align:center;margin-top:12px}
.login-note{margin:-8px 0 14px;font-size:13.5px;color:var(--muted);text-align:center;line-height:1.5}
.adm-ver{font-size:12px;color:#7A8CB0}
.adm-me{display:block;color:#fff;font-weight:700;font-size:14.5px;line-height:1.3}
.adm-me small{display:block;font-weight:400;font-size:12.5px;color:#9FB0CE}
.modal-box .field{text-align:left}
.modal-box h2{color:var(--ink)}
.err-line{color:#B42318;font-size:14px;margin:0 0 8px}

/* toast + modal */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#1B2A1E;color:#fff;padding:12px 20px;border-radius:8px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:#146C43}
.toast.err{background:#B42318}
.toast.warn{background:#8A5A00}
.modal{position:fixed;inset:0;background:rgba(10,22,48,.5);display:grid;place-items:center;z-index:90;padding:20px}
.modal-box{background:#fff;border-radius:10px;padding:24px;max-width:400px;width:100%}
.modal-box p{margin:0 0 20px;font-size:15.5px}
.modal-act{display:flex;justify-content:flex-end;gap:10px}
.modal-act .btn{text-transform:none;letter-spacing:0}

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2br = s => esc(s).replace(/\n/g, "<br>");
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const slugify = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const telHref = p => "tel:" + String(p).replace(/[^\d+]/g, "");

/* ---------- เวอร์ชันของไฟล์นี้ (ต้องตรงกับไฟล์ version.txt ที่อัปขึ้นเซิร์ฟเวอร์) ---------- */
const APP_VERSION = "2026.09.21-2";
/* GitHub Pages สั่งให้เบราว์เซอร์เก็บไฟล์ไว้ 10 นาที ถ้าเพิ่งอัปเดตเว็บ ผู้ใช้อาจยังเห็นของเก่า
   ตรงนี้จึงถามเซิร์ฟเวอร์ว่าเวอร์ชันล่าสุดคืออะไร ถ้าไม่ตรงกับไฟล์ที่กำลังรันอยู่ ให้โหลดใหม่ให้เองหนึ่งครั้ง */
async function checkVersion() {
  if (location.protocol === "file:") return;
  try {
    const r = await fetch("version.txt?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (!v || v === APP_VERSION) return;
    if (sessionStorage.getItem("cis-updated") === v) return;   // กันโหลดวนซ้ำ
    sessionStorage.setItem("cis-updated", v);
    await fetch(location.href, { cache: "reload" }).catch(() => {});
    location.reload();
  } catch (e) {}
}

/* ---------- URL ของแต่ละหน้า (ไม่มี # เมื่อเปิดผ่านเว็บเซิร์ฟเวอร์) ---------- */
const HASHMODE = location.protocol === "file:";          // เปิดไฟล์ตรง ๆ ต้องใช้ # เพราะเบราว์เซอร์ไม่ให้เปลี่ยน path
const BASE = HASHMODE ? "" : (window.__BASE__ || "/");
const U = p => HASHMODE ? "#/" + p : BASE + p;
function currentPath() {
  if (HASHMODE) return location.hash.replace(/^#\/?/, "").replace(/^\/+|\/+$/g, "");
  let p = location.pathname;
  if (p.toLowerCase().indexOf(BASE.toLowerCase()) === 0) p = p.slice(BASE.length);
  return p.replace(/^index\.html/i, "").replace(/^\/+|\/+$/g, "");
}
function go(path) {
  const url = U(path);
  if (HASHMODE) { location.hash = url; return; }
  if (location.pathname !== url) history.pushState({}, "", url);
  route();
}
/* ลิงก์ในโค้ดเขียนเป็น #/xxx ไว้ ตรงนี้แปลงให้เป็น URL จริงตอนแสดงผล */
function fixLinks(root) {
  if (HASHMODE) return;
  (root || document).querySelectorAll('a[href^="#/"]').forEach(a => a.setAttribute("href", U(a.getAttribute("href").slice(2))));
}

/* =========================================================
   STORE — คุยกับ API ที่ Cloudflare (ข้อมูลชุดเดียว ใช้ร่วมกันทุกเครื่อง)
   ถ้าเปิดไฟล์ตรง ๆ หรือโฮสต์ที่ไม่มี API จะกลายเป็นโหมดดูอย่างเดียว
   ========================================================= */
const API = () => (location.protocol === "file:" ? "" : (window.__BASE__ || "/")) + "api/";
async function api(path, options) {
  const r = await fetch(API() + path, { cache: "no-store", credentials: "same-origin", ...options });
  let body = null;
  try { body = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, body, error: (body && body.error) || "" };
}

const Store = {
  data: null,          // เนื้อหาเว็บไซต์
  msgs: null,          // ข้อความจากลูกค้า (โหลดเมื่อเข้าระบบจัดการ)
  me: null,            // ผู้ใช้ที่กำลังเข้าสู่ระบบอยู่
  online: false,       // ต่อ API ได้ไหม
  ready: false,        // มีผู้ใช้งานในระบบแล้วหรือยัง
  async load() {
    if (location.protocol === "file:") { this.data = clone(DEFAULTS); return; }
    try {
      const r = await fetch(API() + "content", { cache: "no-store", credentials: "same-origin" });
      if (r.ok) {
        const j = await r.json();
        this.online = true;
        this.data = j ? migrate(j) : clone(DEFAULTS);
      }
    } catch (e) {}
    if (!this.data) this.data = clone(DEFAULTS);
    if (this.online) {
      const s = await api("state");
      if (s.ok) { this.ready = !!s.body.ready; setAuth(!!s.body.authed, s.body.me); }
    }
  },
  async save() {
    if (!this.online) return false;
    const r = await api("content", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(this.data)
    });
    if (r.status === 401) { setAuth(false); route(); }
    return r.ok;
  },
  async loadMessages() {
    if (!this.online) { this.msgs = []; return; }
    const r = await api("messages");
    this.msgs = r.ok && Array.isArray(r.body) ? r.body : [];
  },
  async saveMessages() {
    if (!this.online) return false;
    const r = await api("messages", {
      method: "PUT",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(this.msgs || [])
    });
    return r.ok;
  }
};

function migrate(d) {
  const base = clone(DEFAULTS);
  const out = { ...base, ...d };
  out.company = { ...base.company, ...(d.company || {}) };
  out.pageHero = { ...base.pageHero, ...(d.pageHero || {}) };
  out.about = { ...base.about, ...(d.about || {}) };
  if (!Array.isArray(out.about.gallery)) out.about.gallery = base.about.gallery;
  ["hero","services","projects","clients"].forEach(k => { if (!Array.isArray(out[k])) out[k] = base[k]; });
  out.projects = out.projects.map(p => ({ img:"", gallery:[], published:true, ...p }));
  delete out.admin;       // รหัสผ่านอยู่ที่เซิร์ฟเวอร์แล้ว ไม่เก็บปนกับเนื้อหา
  delete out.messages;    // ข้อความจากลูกค้าเก็บแยกที่เซิร์ฟเวอร์
  return out;
}

/* ---------- Photo renderer (ไม่มีรูป = เว้นว่าง) ---------- */
function ph(img, alt) {
  if (img) return `<div class="ph"><img src="${esc(img)}" alt="${esc(alt || "")}" loading="lazy"></div>`;
  return `<div class="ph ph-empty" role="img" aria-label="${esc(alt || "ยังไม่มีรูปภาพ")}"></div>`;
}
const logoImg = (cls = "") => `<img data-logo class="${cls}" src="${esc(D() ? D().company.logo : "CIS.png")}" alt="Crystal Ideas Solution">`;

  return `

function toast(msg, type = "ok") {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.className = "toast " + type; t.textContent = msg;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 3200);
}
function ask(msg, okLabel = "ลบ") {
  return new Promise(res => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true" aria-label="ยืนยัน"><p>${esc(msg)}</p><div class="modal-act"><button type="button" class="btn btn-line btn-sm" data-no>ยกเลิก</button><button type="button" class="btn btn-danger btn-sm" data-yes>${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(m); m.querySelector("[data-no]").focus();
    const done = v => { m.remove(); document.removeEventListener("keydown", key); res(v); };
    const key = e => { if (e.key === "Escape") done(false); };
    document.addEventListener("keydown", key);
    m.addEventListener("click", e => { if (e.target.closest("[data-yes]")) done(true); else if (e.target.closest("[data-no]") || e.target === m) done(false); });
  });
}
async function commit(msg = "บันทึกแล้ว") {
  const ok = await Store.save();
  applyChrome();
  if (ok) toast(msg);

}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ย่อรูปก่อนเก็บ เพื่อให้เว็บโหลดเร็ว */
function compress(file, max, keepPng) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) return rej(new Error("type"));
    const r = new FileReader(); r.onerror = rej;
    r.onload = () => {
      if (file.type === "image/svg+xml") return res(r.result);
      const im = new Image(); im.onerror = rej;
      im.onload = () => {
        const sc = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        const ctx = cv.getContext("2d");
        if (!keepPng) { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
        ctx.drawImage(im, 0, 0, cv.width, cv.height);
        res(keepPng ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", .82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

document.addEventListener("change", async e => {
  const inp = e.target;
  if (inp.matches("[data-imgpick]")) {
    const f = inp.files[0]; if (!f) return;
    const box = inp.closest(".imgf"), logo = box.dataset.kind === "logo";
    try {
      const url = await compress(f, logo ? 900 : 1800, logo);
      box.querySelector('input[type="hidden"]').value = url;
      box.querySelector(".imgf-prev").innerHTML = `<img src="${url}" alt="">`;
      box.querySelector("[data-imgclear]").hidden = false;
    } catch (err) { toast("อ่านไฟล์รูปไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG", "err"); }
    inp.value = "";
  }
  if (inp.matches("[data-galpick]")) {
    const add = inp.closest(".gal-add");
    for (const f of inp.files) {
      try { add.insertAdjacentHTML("beforebegin", galItem(await compress(f, 1800, false))); }
      catch (err) { toast(`อ่านไฟล์ ${f.name} ไม่ได้ ข้ามไฟล์นี้`, "err"); }
    }
    inp.value = "";
  }
});
document.addEventListener("click", e => {

      <div class="ed-head"><b>สไลด์ ${i + 1}</b>
        <div class="row-act">
          <button type="button" class="icon-btn" data-mv="-1" ${i === 0 ? "disabled" : ""} aria-label="เลื่อนขึ้น">${AI.up}</button>
          <button type="button" class="icon-btn" data-mv="1" ${i === n - 1 ? "disabled" : ""} aria-label="เลื่อนลง">${AI.down}</button>
          <button type="button" class="icon-btn danger" data-del ${n <= 1 ? "disabled" : ""} aria-label="ลบสไลด์">${AI.trash}</button>
        </div>
      </div>
      <div class="ed-grid">
        ${imgField("img", s.img, "รูปพื้นหลัง", "แนะนำ 1920 x 800 px<br>ถ้าไม่ใส่ จะแสดงเป็นพื้นสีกรมท่า")}
        <div>
          <div class="two">
            <div class="field"><label>หัวข้อ (ไทย)</label><textarea name="title" rows="3">${esc(s.title)}</textarea><small class="hint">กด Enter เพื่อขึ้นบรรทัดใหม่</small></div>
            <div class="field"><label>หัวข้อ (English)</label><textarea name="titleEn" rows="3">${esc(s.titleEn || "")}</textarea><small class="hint">เว้นว่าง = ใช้ข้อความภาษาไทย</small></div>
          </div>
          <div class="two">
            <div class="field"><label>ข้อความรอง (ไทย)</label><textarea name="sub" rows="4">${esc(s.sub)}</textarea></div>
            <div class="field"><label>ข้อความรอง (English)</label><textarea name="subEn" rows="4">${esc(s.subEn || "")}</textarea><small class="hint">เว้นว่าง = ใช้ข้อความภาษาไทย</small></div>
          </div>
        </div>
      </div>
    </article>`;
  const PH = D().pageHero;
  return { title: "แบนเนอร์", html: `
    <form id="heroForm">
      <p class="lead-a">สไลด์หน้าแรกเรียงตามลำดับนี้ และเปลี่ยนอัตโนมัติทุก 7 วินาที</p>
      <div id="slides"></div>
      <section class="card">
        <h2>รูปหัวข้อของหน้าอื่น ๆ</h2>
        <p class="lead-a">ใช้เป็นภาพพื้นหลังแถบหัวข้อด้านบนของแต่ละหน้า (จะมีสีกรมท่าทับให้อ่านตัวอักษรได้ชัด)</p>
        <div class="grid4" id="phBox">
          ${imgField("ph-services", PH.services, "หน้า Services")}
          ${imgField("ph-projects", PH.projects, "หน้า Projects")}
          ${imgField("ph-about", PH.about, "หน้า About Us")}
          ${imgField("ph-contact", PH.contact, "หน้า Contact")}
        </div>
      </section>
      <div class="bar">
        <button type="button" class="btn btn-line btn-sm" id="addSlide">+ เพิ่มสไลด์</button>
        <div class="r"><button class="btn btn-primary btn-sm">บันทึกแบนเนอร์</button></div>
      </div>
    </form>`,
  bind() {
    const box = $("#slides");
    const collect = () => { W = [...box.querySelectorAll(".slide")].map((el, i) => ({ id: W[i].id, title: el.querySelector('[name="title"]').value, titleEn: el.querySelector('[name="titleEn"]').value, sub: el.querySelector('[name="sub"]').value, subEn: el.querySelector('[name="subEn"]').value, img: val(el, "img") })); };
    const draw = () => { box.innerHTML = W.map((s, i) => card(s, i, W.length)).join(""); };
    draw();
    box.addEventListener("click", async e => {
      const b = e.target.closest("[data-mv],[data-del]"); if (!b) return;
      const i = +b.closest(".slide").dataset.i; collect();
      if (b.dataset.mv) { const j = i + +b.dataset.mv; [W[i], W[j]] = [W[j], W[i]]; draw(); }
      else if (await ask(`ลบสไลด์ที่ ${i + 1} ใช่ไหม`)) { W.splice(i, 1); draw(); }
    });
    $("#addSlide").onclick = () => { collect(); W.push({ id: uid(), title: "หัวข้อใหม่", sub: "", img: "" }); draw(); box.lastElementChild.scrollIntoView({ behavior: "smooth" }); };
    $("#heroForm").onsubmit = e => {
      e.preventDefault(); collect();
      if (W.some(s => !s.title.trim())) return toast("กรุณากรอกหัวข้อให้ครบทุกสไลด์", "err");
      D().hero = W.map(s => ({ ...s, title: s.title.trim(), titleEn: s.titleEn.trim(), sub: s.sub.trim(), subEn: s.subEn.trim() }));
      const pb = $("#phBox");
      D().pageHero = { services: val(pb,"ph-services"), projects: val(pb,"ph-projects"), about: val(pb,"ph-about"), contact: val(pb,"ph-contact") };
      commit("บันทึกแบนเนอร์แล้ว");
    };
  } };
},

/* ---------- Projects ---------- */
projects(a, b) {
  if (a === "new") return projectForm(null);
  if (a === "edit") return projectForm(decodeURIComponent(b || ""));
  return { title: "ผลงาน", action: `<a class="btn btn-primary btn-sm" href="#/admin/projects/new">+ <span>เพิ่มผลงาน</span></a>`, html: `
    <div class="toolbar">
      <input type="search" id="pq" placeholder="ค้นหาชื่อผลงาน สถานที่ หรือประเภทงาน" aria-label="ค้นหาผลงาน">
      <select id="pc" aria-label="กรองตามหมวด"><option value="">ทุกหมวด</option>${CATS.map(([k,l]) => `<option value="${k}">${l}</option>`).join("")}</select>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>รูป</th><th class="grow">ชื่อผลงาน</th><th>หมวด</th><th>ปี</th><th>แสดงบนเว็บ</th><th>ลำดับ</th><th>จัดการ</th></tr></thead>
        <tbody id="ptb"></tbody>
      </table>
    </div>
    <p class="hint" style="margin-top:10px">ผลงานด้านบนสุดจะแสดงก่อนบนเว็บ หน้าแรกแสดง 8 ผลงานแรกที่เปิดแสดงอยู่ · ปุ่มเลื่อนลำดับใช้ได้เมื่อไม่ได้ค้นหาหรือกรองหมวด</p>`,
  bind() {
    const tb = $("#ptb"), q = $("#pq"), c = $("#pc");
    const draw = () => {
      const kw = q.value.trim().toLowerCase(), cat = c.value, filtering = kw || cat;
      const P = D().projects;
      const list = P.map((p, i) => ({ p, i })).filter(({ p }) => (!cat || p.cat === cat) && (!kw || [p.name, p.location, p.type, p.area].join(" ").toLowerCase().includes(kw)));
      tb.innerHTML = list.length ? list.map(({ p, i }) => `
        <tr data-id="${esc(p.id)}">
          <td class="tthumb">${ph(p.img, p.name)}</td>
          <td class="grow"><b>${esc(p.name)}</b><small>${esc(p.type)}${p.location ? " · " + esc(p.location) : ""}</small></td>
          <td><span class="tag">${CAT_LABEL[p.cat] || p.cat}</span></td>
          <td>${esc(p.year)}</td>
          <td><input type="checkbox" class="sw" data-pub ${p.published !== false ? "checked" : ""} aria-label="แสดง ${esc(p.name)} บนเว็บ"></td>
          <td><div class="row-act">
            <button type="button" class="icon-btn" data-mv="-1" ${filtering || i === 0 ? "disabled" : ""} aria-label="เลื่อนขึ้น">${AI.up}</button>
            <button type="button" class="icon-btn" data-mv="1" ${filtering || i === P.length - 1 ? "disabled" : ""} aria-label="เลื่อนลง">${AI.down}</button>
          </div></td>
          <td><div class="row-act">
            <a class="icon-btn" href="#/admin/projects/edit/${encodeURIComponent(p.id)}" aria-label="แก้ไข ${esc(p.name)}">${AI.edit}</a>
            <button type="button" class="icon-btn danger" data-del aria-label="ลบ ${esc(p.name)}">${AI.trash}</button>
          </div></td>
        </tr>`).join("")
        : `<tr><td colspan="7" class="tbl-empty">${D().projects.length ? "ไม่พบผลงานที่ตรงกับคำค้นหา" : 'ยังไม่มีผลงาน กด "เพิ่มผลงาน" เพื่อเริ่มต้น'}</td></tr>`;
    };
    draw();
    q.addEventListener("input", draw); c.addEventListener("change", draw);
    tb.addEventListener("change", e => {
      if (!e.target.matches("[data-pub]")) return;
      const p = D().projects.find(x => x.id === e.target.closest("tr").dataset.id);
      p.published = e.target.checked;
      commit(p.published ? `แสดง "${p.name}" บนเว็บแล้ว` : `ซ่อน "${p.name}" จากเว็บแล้ว`);
    });
    tb.addEventListener("click", async e => {
      const b = e.target.closest("[data-mv],[data-del]"); if (!b) return;
      const P = D().projects, i = P.findIndex(x => x.id === b.closest("tr").dataset.id);
      if (b.dataset.mv) { const j = i + +b.dataset.mv; [P[i], P[j]] = [P[j], P[i]]; draw(); commit("เปลี่ยนลำดับแล้ว"); }
      else if (await ask(`ลบผลงาน "${P[i].name}" ใช่ไหม ลบแล้วกู้คืนไม่ได้`)) { P.splice(i, 1); draw(); commit("ลบผลงานแล้ว"); }
    });
  } };
},

/* ---------- Messages ---------- */
messages() {
  return { title: "ข้อความจากลูกค้า", action: `<button type="button" class="btn btn-line btn-sm" id="csv">ดาวน์โหลด <span>CSV</span></button>`, html: `
    <div class="toolbar">
      <select id="mf" aria-label="กรองข้อความ"><option value="all">ข้อความทั้งหมด</option><option value="unread">เฉพาะที่ยังไม่อ่าน</option></select>
    </div>
    <div id="msgs"></div>`,
  bind() {
    const box = $("#msgs"), mf = $("#mf");
    const draw = () => {
      const list = (Store.msgs || []).filter(m => mf.value === "all" || !m.read);
      box.innerHTML = list.length ? list.map(m => `
        <details class="msg ${m.read ? "" : "unread"}" data-id="${m.id}">
          <summary><b>${esc(m.name)}</b><small>${fmtDate(m.date)}</small><small>${esc(m.type || "ไม่ระบุประเภทงาน")} · ${esc(m.tel)}</small></summary>
          <div class="msg-body">
            <dl>
              <dt>เบอร์โทร</dt><dd><a href="${telHref(m.tel)}" style="color:var(--blue)">${esc(m.tel)}</a></dd>
              <dt>อีเมล</dt><dd>${m.email ? `<a href="mailto:${esc(m.email)}" style="color:var(--blue)">${esc(m.email)}</a>` : "-"}</dd>
              <dt>ประเภทงาน</dt><dd>${esc(m.type || "-")}</dd>
              <dt>รายละเอียด</dt><dd>${esc(m.message || "-")}</dd>
            </dl>
            <div class="row-act"><button type="button" class="btn btn-line btn-xs" data-unread>ทำเครื่องหมายว่ายังไม่อ่าน</button><button type="button" class="btn-text" data-del>ลบข้อความ</button></div>
          </div>
        </details>`).join("")
        : `<div class="card empty-a"><b>${(Store.msgs || []).length ? "อ่านครบทุกข้อความแล้ว" : "ยังไม่มีข้อความ"}</b>ข้อความที่ลูกค้าส่งจากฟอร์มหน้า "ติดต่อเรา" จะแสดงที่นี่</div>`;
    };
    const refreshBadge = () => { const a = document.querySelector('.adm-side a[data-adm="messages"]'); const em = a.querySelector("em"); const n = unread(); if (n) { if (em) em.textContent = n; else a.insertAdjacentHTML("beforeend", `<em>${n}</em>`); } else if (em) em.remove(); };
    draw(); mf.onchange = draw;
    box.addEventListener("toggle", e => {
      const d = e.target; if (!d.open) return;
      const m = (Store.msgs || []).find(x => x.id === d.dataset.id);
      if (m && !m.read) { m.read = true; d.classList.remove("unread"); Store.saveMessages(); refreshBadge(); }
    }, true);
    box.addEventListener("click", async e => {
      const d = e.target.closest(".msg"); if (!d) return;
      const M = Store.msgs || [], i = M.findIndex(x => x.id === d.dataset.id);
      if (i < 0) return;
      if (e.target.closest("[data-unread]")) { M[i].read = false; draw(); refreshBadge(); Store.saveMessages(); }
      if (e.target.closest("[data-del]") && await ask(`ลบข้อความจาก "${M[i].name}" ใช่ไหม`)) {
        M.splice(i, 1); draw(); refreshBadge();
        toast(await Store.saveMessages() ? "ลบข้อความแล้ว" : "ลบไม่สำเร็จ กรุณาลองใหม่", await Store.saveMessages() ? "ok" : "err");
      }
    });
    $("#csv").onclick = () => {
      if (!(Store.msgs || []).length) return toast("ยังไม่มีข้อความให้ดาวน์โหลด", "err");
      const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const rows = [["วันที่","ชื่อ","เบอร์โทร","อีเมล","ประเภทงาน","รายละเอียด","อ่านแล้ว"], ...(Store.msgs || []).map(m => [fmtDate(m.date), m.name, m.tel, m.email, m.type, m.message, m.read ? "ใช่" : "ไม่"])];
      download("crystal-messages.csv", "﻿" + rows.map(r => r.map(q).join(",")).join("\r\n"), "text/csv;charset=utf-8");
    };
  } };
},

/* ---------- Backup ---------- */
backup() {
  const size = (new Blob([JSON.stringify(D())]).size / 1024 / 1024).toFixed(2);
  return { title: "สำรองข้อมูล", html: `
    <div class="note info">เนื้อหาทั้งหมดเก็บอยู่ที่เซิร์ฟเวอร์ ทุกเครื่องเห็นชุดเดียวกัน ขนาดปัจจุบันประมาณ ${size} MB (จำกัดไม่เกิน 10 MB) ควรดาวน์โหลดไฟล์สำรองเก็บไว้เป็นระยะ</div>
    <div class="grid3">
      <section class="card"><h2>ดาวน์โหลดไฟล์สำรอง</h2><p class="lead-a">บันทึกเนื้อหาทั้งหมดเป็นไฟล์ .json เก็บไว้ หรือนำไปใช้ต่อในเครื่องอื่น</p><button type="button" class="btn btn-primary btn-sm" id="exp">ดาวน์โหลดไฟล์สำรอง</button></section>
      <section class="card"><h2>นำเข้าไฟล์สำรอง</h2><p class="lead-a">แทนที่เนื้อหาปัจจุบันทั้งหมดด้วยข้อมูลจากไฟล์ .json ที่เคยดาวน์โหลดไว้</p><label class="btn btn-line btn-sm" style="cursor:pointer">เลือกไฟล์ .json<input type="file" accept="application/json,.json" hidden id="imp"></label></section>
      <section class="card"><h2>คืนค่าตั้งต้น</h2><p class="lead-a">ลบการแก้ไขทั้งหมดและกลับไปใช้เนื้อหาตั้งต้น (ข้อความจากลูกค้าไม่ถูกลบ)</p><button type="button" class="btn btn-line btn-sm" id="rst" style="color:#B42318">คืนค่าตั้งต้น</button></section>
    </div>`,
  bind() {
    $("#exp").onclick = () => { const d = new Date().toISOString().slice(0, 10); download(`crystal-website-backup-${d}.json`, JSON.stringify(D(), null, 1), "application/json"); };
    $("#imp").onchange = async e => {
      const f = e.target.files[0]; e.target.value = ""; if (!f) return;
      let obj;
      try { obj = JSON.parse(await f.text()); } catch (err) { return toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองที่อ่านได้ ลองเลือกไฟล์ .json ที่ดาวน์โหลดจากหน้านี้", "err"); }
      if (!obj || !Array.isArray(obj.projects) || !Array.isArray(obj.hero)) return toast("ไฟล์นี้ไม่ใช่ไฟล์สำรองของเว็บไซต์นี้", "err");
      if (!await ask("นำเข้าไฟล์นี้และแทนที่เนื้อหาปัจจุบันทั้งหมด ใช่ไหม", "นำเข้า")) return;
      Store.data = migrate(obj); await commit("นำเข้าข้อมูลแล้ว"); route();
    };
    $("#rst").onclick = async () => {
      if (!await ask("คืนค่าตั้งต้นและลบการแก้ไขทั้งหมด ใช่ไหม", "คืนค่าตั้งต้น")) return;
      Store.data = migrate(clone(DEFAULTS));
      await commit("คืนค่าตั้งต้นแล้ว"); route();
    };
  } };
}
};

/* =========================================================
   หน้าจัดการผู้ใช้งาน (เฉพาะเจ้าของระบบ)
   ========================================================= */
const ROLE_TH = { owner: "เจ้าของระบบ", editor: "ผู้ดูแลเนื้อหา" };
const isOwner = () => !!(Store.me && Store.me.role === "owner");

function userModal(u) {
  const edit = !!u;
  return new Promise(res => {
    const m = document.createElement("div");
    m.className = "modal";
    m.innerHTML = `
      <div class="modal-box" role="dialog" aria-modal="true" aria-label="${edit ? "แก้ไขผู้ใช้งาน" : "เพิ่มผู้ใช้งาน"}">
        <h2 style="margin:0 0 16px;font-size:17px;font-weight:800">${edit ? "แก้ไขผู้ใช้งาน" : "เพิ่มผู้ใช้งาน"}</h2>
        <form id="uForm" autocomplete="off">
          <div class="field"><label for="u-name">ชื่อที่แสดง</label><input id="u-name" value="${esc(edit ? u.name : "")}" placeholder="เช่น สมชาย ใจดี"></div>
          <div class="field"><label for="u-username">ชื่อผู้ใช้ (ใช้เข้าสู่ระบบ)</label>
            <input id="u-username" value="${esc(edit ? u.username : "")}" ${edit ? "disabled" : ""} autocomplete="off" placeholder="เช่น somchai">
            <small class="hint">${edit ? "ชื่อผู้ใช้เปลี่ยนไม่ได้" : "ใช้ a-z 0-9 . _ - ยาว 3-32 ตัว"}</small></div>
          <div class="field"><label for="u-role">สิทธิ์การใช้งาน</label>
            <select id="u-role">
              <option value="editor">ผู้ดูแลเนื้อหา — แก้เนื้อหาและข้อความได้</option>
              <option value="owner">เจ้าของระบบ — จัดการผู้ใช้งานได้ด้วย</option>
            </select></div>
          <div class="field"><label for="u-pw">${edit ? "ตั้งรหัสผ่านใหม่" : "รหัสผ่าน"}</label>
            <div class="pw-wrap">
              <input id="u-pw" type="password" autocomplete="new-password">
              <button type="button" class="pw-eye" data-eye="u-pw" aria-label="แสดงรหัสผ่าน" aria-pressed="false">${AI.eye}</button>
            </div>
            <small class="hint">${edit ? "เว้นว่างไว้ถ้าไม่ต้องการเปลี่ยนรหัสผ่าน" : "อย่างน้อย 8 ตัวอักษร"}</small></div>
          <p class="err-line" id="uErr" hidden></p>
          <div class="modal-act">
            <button type="button" class="btn btn-line btn-sm" data-no>ยกเลิก</button>
            <button class="btn btn-primary btn-sm">${edit ? "บันทึก" : "เพิ่มผู้ใช้"}</button>
          </div>
        </form>
      </div>`;
    document.body.appendChild(m);
    const q = s => m.querySelector(s);
    q("#u-role").value = edit ? u.role : "editor";
    setTimeout(() => q(edit ? "#u-name" : "#u-username").focus(), 30);
    const done = v => { m.remove(); document.removeEventListener("keydown", key); res(v); };
    const key = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", key);
    m.addEventListener("click", e => { if (e.target === m || e.target.closest("[data-no]")) done(null); });
    q("#uForm").onsubmit = e => {
      e.preventDefault();
      const err = msg => { q("#uErr").textContent = msg; q("#uErr").hidden = false; };
      const out = { name: q("#u-name").value.trim(), role: q("#u-role").value, password: q("#u-pw").value };
      if (!edit) {
        out.username = q("#u-username").value.trim().toLowerCase();
        if (!/^[a-z0-9._-]{3,32}$/.test(out.username)) return err("ชื่อผู้ใช้ต้องเป็น a-z 0-9 . _ - ยาว 3-32 ตัว");
        if (out.password.length < 8) return err("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร");
      } else if (out.password && out.password.length < 8) return err("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร");
      done(out);
    };
  });
}

const AdminUsers = {
users() {
  if (!isOwner()) return { title: "ผู้ใช้งาน", html: `<div class="card empty-a"><b>เข้าหน้านี้ไม่ได้</b>เฉพาะเจ้าของระบบเท่านั้นที่จัดการผู้ใช้งานได้</div>` };
  return { title: "ผู้ใช้งาน", action: `<button type="button" class="btn btn-primary btn-sm" id="addUser">+ <span>เพิ่มผู้ใช้</span></button>`, html: `
    <p class="lead-a">ทุกคนใช้ระบบจัดการเดียวกัน เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านของตัวเอง</p>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th class="grow">ชื่อที่แสดง</th><th>ชื่อผู้ใช้</th><th>สิทธิ์</th><th>สถานะ</th><th>เข้าใช้ล่าสุด</th><th>จัดการ</th></tr></thead>
        <tbody id="utb"><tr><td colspan="6" class="tbl-empty">กำลังโหลด…</td></tr></tbody>
      </table>
    </div>
    <div class="note info" style="margin-top:18px"><b>สิทธิ์การใช้งาน</b><br>
      เจ้าของระบบ: แก้เนื้อหา ตอบข้อความ และเพิ่ม/ลบผู้ใช้งานได้<br>
      ผู้ดูแลเนื้อหา: แก้เนื้อหาและตอบข้อความได้ แต่จัดการผู้ใช้งานไม่ได้</div>`,
  bind() {
    const tb = $("#utb");
    let list = [];
    const draw = () => {
      tb.innerHTML = list.length ? list.map(u => `
        <tr data-id="${esc(u.id)}">
          <td class="grow"><b>${esc(u.name)}</b>${u.id === Store.me.id ? '<small>บัญชีของคุณ</small>' : ""}</td>
          <td>${esc(u.username)}</td>
          <td><span class="tag">${ROLE_TH[u.role] || u.role}</span></td>
          <td>${u.active ? '<span class="tag" style="background:#E6F6EC;color:#146C43">ใช้งานได้</span>' : '<span class="tag" style="background:#FDE8E8;color:#B42318">ถูกระงับ</span>'}</td>
          <td><small>${u.lastLogin ? fmtDate(u.lastLogin) : "ยังไม่เคยเข้า"}</small></td>
          <td><div class="row-act">
            <button type="button" class="icon-btn" data-edit aria-label="แก้ไข ${esc(u.name)}">${AI.edit}</button>
            <button type="button" class="icon-btn" data-toggle aria-label="${u.active ? "ระงับ" : "เปิดใช้"} ${esc(u.name)}" title="${u.active ? "ระงับการใช้งาน" : "เปิดใช้งาน"}">${u.active ? AI.lock : AI.unlock}</button>
            <button type="button" class="icon-btn danger" data-del aria-label="ลบ ${esc(u.name)}">${AI.trash}</button>
          </div></td>
        </tr>`).join("") : `<tr><td colspan="6" class="tbl-empty">ยังไม่มีผู้ใช้งาน</td></tr>`;
    };
    const reload = async () => {
      const r = await api("users");
      if (!r.ok) { tb.innerHTML = `<tr><td colspan="6" class="tbl-empty">${esc(r.error || "โหลดรายชื่อไม่สำเร็จ")}</td></tr>`; return; }
      list = r.body || []; draw();
    };
    reload();

    $("#addUser").onclick = async () => {
      const data = await userModal(null);
      if (!data) return;
      const r = await api("users", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
      if (!r.ok) return toast(r.error || "เพิ่มผู้ใช้ไม่สำเร็จ", "err");
      toast(`เพิ่มผู้ใช้ "${data.username}" แล้ว`); reload();
    };

    tb.addEventListener("click", async e => {
      const btn = e.target.closest("[data-edit],[data-toggle],[data-del]"); if (!btn) return;
      const u = list.find(x => x.id === btn.closest("tr").dataset.id); if (!u) return;

      if (btn.hasAttribute("data-edit")) {
        const data = await userModal(u);
        if (!data) return;
        const payload = { id: u.id, name: data.name, role: data.role };
        if (data.password) payload.password = data.password;
        const r = await api("users", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
        if (!r.ok) return toast(r.error || "บันทึกไม่สำเร็จ", "err");
        toast("บันทึกข้อมูลผู้ใช้แล้ว"); reload();
      }

      if (btn.hasAttribute("data-toggle")) {
        const on = !u.active;
        if (!on && !await ask(`ระงับการใช้งานของ "${u.name}" ใช่ไหม ผู้ใช้จะเข้าระบบไม่ได้ทันที`, "ระงับ")) return;
        const r = await api("users", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: u.id, active: on }) });
        if (!r.ok) return toast(r.error || "ทำรายการไม่สำเร็จ", "err");
        toast(on ? `เปิดใช้งาน "${u.name}" แล้ว` : `ระงับ "${u.name}" แล้ว`); reload();
      }

      if (btn.hasAttribute("data-del")) {
        if (!await ask(`ลบผู้ใช้ "${u.name}" ใช่ไหม ลบแล้วกู้คืนไม่ได้`)) return;
        const r = await api("users?id=" + encodeURIComponent(u.id), { method: "DELETE" });
        if (!r.ok) return toast(r.error || "ลบไม่สำเร็จ", "err");
        toast(`ลบผู้ใช้ "${u.name}" แล้ว`); reload();
      }
    });
  } };
}
};

/* แคปช่า: วาดอักษรสุ่มลงบน canvas กันบอทกรอกอัตโนมัติ */
function drawCaptcha() {
  const cv = $("#capImg"); if (!cv) return "";
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
  const x = cv.getContext("2d"), w = cv.width, hgt = cv.height;
  x.clearRect(0, 0, w, hgt);
  x.fillStyle = "#EEF2F8"; x.fillRect(0, 0, w, hgt);
  for (let i = 0; i < 5; i++) {
    x.strokeStyle = `rgba(${40 + Math.random() * 120},${90 + Math.random() * 110},${180 + Math.random() * 70},.5)`;
    x.lineWidth = 1 + Math.random();
    x.beginPath(); x.moveTo(Math.random() * w, Math.random() * hgt);
    x.bezierCurveTo(Math.random() * w, Math.random() * hgt, Math.random() * w, Math.random() * hgt, Math.random() * w, Math.random() * hgt);
    x.stroke();
  }
  for (let i = 0; i < 90; i++) {
    x.fillStyle = `rgba(10,22,48,${.08 + Math.random() * .22})`;
    x.fillRect(Math.random() * w, Math.random() * hgt, 2, 2);
  }
  const step = (w - 22) / code.length;
  for (let i = 0; i < code.length; i++) {
    x.save();
    x.translate(14 + i * step, hgt / 2 + (Math.random() * 8 - 4));
    x.rotate((Math.random() * 46 - 23) * Math.PI / 180);
    x.font = `800 ${32 + Math.round(Math.random() * 6)}px Arial, Helvetica, sans-serif`;
    x.textAlign = "center"; x.textBaseline = "middle";
    x.lineWidth = 3; x.strokeStyle = "rgba(255,255,255,.85)";
    x.strokeText(code[i], 0, 0);
    x.fillStyle = `hsl(${208 + Math.random() * 26},${60 + Math.random() * 25}%,${16 + Math.random() * 12}%)`;
    x.fillText(code[i], 0, 0);
    x.restore();
  }
  return code;
}

async function renderAdmin(sub, a, b) {
  document.body.classList.add("is-admin");
  document.title = "ระบบจัดการเว็บไซต์ | Crystal Ideas Solution";

  if (!authed) {
    const firstRun = Store.online && !Store.ready;
    app.innerHTML = loginHTML(firstRun);
    let code = drawCaptcha();
    const err = $("#loginErr"), btn = $("#loginBtn");
    const show = m => { err.textContent = m; err.hidden = !m; };
    $("#capNew").onclick = () => { code = drawCaptcha(); $("#cap").value = ""; $("#cap").focus(); };
    $("#user").focus();
    if (!Store.online) show("เครื่องนี้ยังติดต่อเซิร์ฟเวอร์ไม่ได้ จึงเข้าระบบจัดการไม่ได้ (เปิดเว็บผ่านที่อยู่จริงของเว็บไซต์ ไม่ใช่การเปิดไฟล์ตรง ๆ)");

    $("#loginForm").onsubmit = async e => {
      e.preventDefault();
      if (!Store.online) return;
      if ($("#cap").value.trim().toUpperCase() !== code) {
        code = drawCaptcha(); $("#cap").value = "";
        show("อักษรยืนยันไม่ถูกต้อง ลองใหม่อีกครั้ง"); $("#cap").focus();
        return;
      }
      const pw = $("#pw").value, username = $("#user").value.trim().toLowerCase();
      if (!username) return show("กรุณากรอกชื่อผู้ใช้");
      btn.disabled = true;
      let r;
      if (firstRun) {
        if (!/^[a-z0-9._-]{3,32}$/.test(username)) { btn.disabled = false; return show("ชื่อผู้ใช้ต้องเป็น a-z 0-9 . _ - ยาว 3-32 ตัว"); }
        if (pw.length < 8) { btn.disabled = false; return show("รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร"); }
        if (pw !== $("#pw2").value) { btn.disabled = false; return show("รหัสผ่านทั้งสองช่องไม่ตรงกัน"); }
        r = await api("setup", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, name: $("#uname").value.trim(), password: pw }) });
      } else {
        r = await api("login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username, password: pw }) });
      }
      btn.disabled = false;
      if (r.ok) { Store.ready = true; setAuth(true, r.body && r.body.me); route(); return; }
      code = drawCaptcha(); $("#cap").value = "";
      show(r.error || "เข้าสู่ระบบไม่สำเร็จ ลองอีกครั้ง");
      $("#pw").select();
    };
    return;
  }

  if (Store.msgs === null) await Store.loadMessages();
  const key = AdminViews.hasOwnProperty(sub) ? sub : "";
  const v = AdminViews[key](a, b);
  app.innerHTML = shell(key, v.title, v.html, v.action || "");
  fixLinks(app);
  const adm = $("#adm");
  $("#admMenu").onclick = () => adm.classList.add("nav-open");
  $("#admScrim").onclick = () => adm.classList.remove("nav-open");
  $("#logout").onclick = async () => {
    await api("logout", { method: "POST" });
    setAuth(false); Store.msgs = null; go("");
  };
  v.bind && v.bind();
}

   ROUTER
   ========================================================= */
function route() {
  cleanup.forEach(fn => fn()); cleanup = [];
  const parts = currentPath().split("/");
  closeMenu();
  if (parts[0] === "admin") { renderAdmin(parts[1] || "", parts[2], parts[3]); fixLinks(app); window.scrollTo(0, 0); return; }
  document.body.classList.remove("is-admin");
  const name = parts[0];
  const page = name === "project" ? "project" : (Pages.hasOwnProperty(name) && name !== "project" ? name : "home");
  app.innerHTML = Pages[page](parts[1]);
  fixLinks(app);
  after[page] && after[page]();
  const navKey = page === "project" ? "projects" : page;
  document.querySelectorAll("[data-nav]").forEach(a => {
    const on = a.dataset.nav === navKey; a.classList.toggle("active", on);
    on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  });
  const brand = "Crystal Ideas Solution";
  const titles = {
    home: isEN() ? brand + " | Vinyl • Sticker • Sign • Structure" : "บริษัท คริสตัล ไอเดีย โซลูชั่น จำกัด | " + brand,
    services: t("nav.services") + " | " + brand,
    projects: t("nav.projects") + " | " + brand,
    about: t("nav.about") + " | " + brand,
    contact: t("nav.contact") + " | " + brand
  };
  document.title = page === "project" ? ((pubProjects().find(p => p.id === decodeURIComponent(parts[1] || "")) || {}).name || t("nav.projects")) + " | " + brand : titles[page];
  window.scrollTo(0, 0);
}

const header = document.querySelector(".site-header"), mbtn = document.querySelector(".menu-btn");
function closeMenu() { header.classList.remove("menu-open"); mbtn.setAttribute("aria-expanded", "false"); document.body.style.overflow = ""; }
mbtn.addEventListener("click", () => {
  const open = !header.classList.contains("menu-open");
  header.classList.toggle("menu-open", open); mbtn.setAttribute("aria-expanded", open);
  document.body.style.overflow = open ? "hidden" : "";
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
document.addEventListener("click", e => {
  const eye = e.target.closest("[data-eye]"); if (!eye) return;
  const inp = document.getElementById(eye.dataset.eye); if (!inp) return;
  const showing = inp.type === "password";
  inp.type = showing ? "text" : "password";
  eye.innerHTML = showing ? AI.eyeOff : AI.eye;
  eye.setAttribute("aria-pressed", showing);
  eye.setAttribute("aria-label", showing ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน");
  eye.title = showing ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน";
  const end = inp.value.length;
  inp.focus(); try { inp.setSelectionRange(end, end); } catch (err) {}
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]"); if (!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang;
  try { localStorage.setItem("cis-lang", LANG); } catch (err) {}
  applyChrome(); route();
});

if (HASHMODE) window.addEventListener("hashchange", route);
else {
  window.addEventListener("popstate", route);
  document.addEventListener("click", e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest("a"); if (!a || a.target === "_blank" || a.hasAttribute("download")) return;
    const href = a.getAttribute("href"); if (!href) return;
    let path = null;
    if (href.indexOf("#/") === 0) path = href.slice(2);
    else if (href.indexOf(BASE) === 0 && !/^[a-z]+:/i.test(href)) path = href.slice(BASE.length);
    if (path === null) return;
    e.preventDefault();
    go(path);
  });
  /* ลิงก์เก่าแบบ #/xxx ที่เคยบันทึกไว้ ให้เด้งไปหน้าเดียวกันแบบไม่มี # */
  if (location.hash.indexOf("#/") === 0) history.replaceState({}, "", U(location.hash.slice(2)));
  else if (/index.html$/i.test(location.pathname)) history.replaceState({}, "", BASE);
  new MutationObserver(() => fixLinks(app)).observe(app, { childList: true, subtree: true });
}
fixLinks(document);
Store.load().then(() => { applyChrome(); route(); checkVersion(); });
